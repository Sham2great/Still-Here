const deeperReading={
lonely:"Loneliness can exist in a crowded room because being around people is not the same as feeling understood. You may have learned to keep conversations light, play a role, or hide the parts of you that feel hardest to explain. You do not need to become someone else to deserve connection. Start by noticing who makes you feel safe enough to be honest, even in a small way. If the first person does not respond well, that does not prove nobody will. Connection often grows through repeated small moments, not one perfect conversation.",unseen:"Wanting someone to notice is a very human need. It can be tiring to be the one who always says you are fine, then quietly hopes someone will hear the part you did not say. People are not always able to read what is hidden, so giving someone a small clue can help them understand. You are not asking them to solve your life; you are giving them a chance to show up. Choose someone whose actions have made them feel safe, and remember that you can share at your own pace.",mask:"A mask can help you get through a day, but wearing it everywhere can make you feel even more separate from others. You do not owe every person the full story, and you can keep your privacy. The important thing is to have some space where you do not need to pretend. Honest connection does not require a dramatic confession; it can begin with admitting that a week has been hard or asking someone to sit with you. Notice who listens without making you feel small.",burden:"If you worry about being a burden, you might wait until you are completely overwhelmed before asking for anything. But support can be ordinary and shared: a conversation, company, practical help, or someone checking in later. It is okay to ask whether another person has the capacity to listen, and it is okay for them to answer honestly. That is different from deciding your feelings are too much to deserve care. You can respect people's limits without erasing your own needs.",people:"A crowd can offer company without giving you belonging. Meaningful connection is often built when you can be honest, ask questions, share ordinary moments, and feel respected even when you disagree. You do not need a huge circle, and you do not have to force closeness with people who leave you feeling smaller. Give time to relationships where effort goes both ways. You can also build connection through shared interests, clubs, teams, or communities where conversation has a natural starting point.",damage:"When you regret something, fear can rush ahead and treat every possible consequence as if it has already happened. The fair response is neither to dismiss the impact nor to decide your life is over. Find out what was actually affected, what responsibility belongs to you, and what options remain. If another person was affected, repair may require listening to their needs and respecting their boundaries. You can be honest about the past while still taking useful steps in the present.",school:"School can feel tied to your entire future, so a setback may seem larger than it is. Take it seriously enough to act, but not so personally that you stop looking for options. Ask what the actual rules, deadlines, retake possibilities, or support options are. A teacher, school counsellor, or trusted adult may know paths you cannot see while you're stressed. A plan based on facts will help more than repeatedly imagining the worst outcome.",judgment:"The possibility of being judged can make you want to hide, defend yourself, or decide that everyone has already made up their mind. You cannot control every opinion, and not every opinion deserves equal weight. You can still take responsibility for what is yours, make a sincere repair where appropriate, and show through repeated actions what you value. Let yourself learn without demanding that every person immediately understand you. Your identity is built from more than one moment.",unknown:"Not knowing can be exhausting because the mind keeps trying to finish the story. But a frightening guess is still a guess. Give yourself a clear process: identify what is known, find the most reliable source for what is unknown, and decide when you will revisit the question. For a health concern, involve a qualified health professional or trusted adult; for school, ask someone who knows the requirements; for a relationship, seek clear communication where appropriate. You do not have to answer every possible future scenario tonight.",repair:"Repair is an action, not a guarantee. You can acknowledge harm, apologise without making excuses, correct a mistake where possible, and change the behaviour that led to it. The other person may need time or may not choose to restore the relationship, and respecting that is part of taking responsibility. Even then, your effort can help you become more honest and careful going forward. You can learn from what happened without turning regret into a permanent identity.",truth:"Facts are useful because they give you something solid to work with. When you are worried about the future, try not to confuse what you know with what you fear. Ask a clear question, choose a trustworthy source, and be open to an answer that is more complicated than either reassurance or disaster. If the issue is medical, do not rely on guesses or online speculation alone. If it concerns school or a relationship, someone directly involved or qualified may help you understand what choices remain.",support:"You do not need to wait until a situation becomes a crisis to ask for help thinking it through. Choose someone who can be calm, honest, and respectful. Depending on the situation, that might be a trusted adult, teacher, counsellor, health professional, or someone who understands the relationship involved. You can tell them what happened, what you're afraid it means, and what you need help figuring out. Support does not remove your responsibility; it can help you carry it wisely.",accountability:"Taking responsibility is different from sentencing yourself. Responsibility asks what happened, who was affected, what can be repaired, and what you will change. Shame often turns those questions into “What is wrong with me?” and then offers no useful next step. You can regret an action and still believe that your future choices matter. Let accountability be specific enough to guide change, and fair enough to leave room for growth.",future:"A past choice may affect what happens next, but it cannot tell the entire story in advance. Some outcomes are outside your control; some can be influenced by honest communication, support, changed habits, or a practical plan. You do not have to pretend nothing matters. You only have to resist treating one chapter as the complete book. Give the future a chance to respond to what you do next, not only to what happened before.",action:"When you feel responsible for a future you cannot fully predict, it helps to separate control from influence. You may not control how another person reacts, what an old mistake costs, or every result at school. You may be able to ask for help, clarify facts, make amends, prepare differently, or take care of your health. Choose one step that is actually available rather than ten imagined steps that depend on things you cannot control.",

small:"You do not have to solve the entire situation to prove that you are trying. When life feels too big, the mind can turn every unfinished task into a judgment about who you are. Separate your circumstances from your identity. You are someone facing difficult things, not a failure because those things are difficult. A small step counts because it brings you back into contact with what you can influence. Tomorrow can have its own step.",
reach:"Being supported does not make you weak or difficult to love. People who care about you may not know what is happening unless you give them a chance to understand. You can ask for company without having a perfect explanation, and you can ask for practical help without apologising for existing. Choose people who listen, respect your privacy, and take your feelings seriously. You deserve support before everything becomes unbearable.",
pressure:"You may have learned to use pressure because it gets things done in the short term. But being harsh with yourself can make every mistake feel dangerous and every rest feel undeserved. Discipline works better when it includes recovery, realistic expectations, and room to be human. You can take responsibility for your next step without insulting the person taking it.",
hide:"Silence can feel safer when you are tired of being misunderstood. You get to choose what you share and with whom. Still, you deserve at least one place where you do not have to perform being fine. You can start small, with a sentence like “I have a lot on my mind and I don't know how to explain it yet.” The right person does not need you to make your pain sound neat before they can care.",
feel:"A feeling can be real without being an instruction. Missing someone does not automatically mean you should return; fear does not automatically mean you are in danger; sadness does not mean nothing good remains. Give the feeling room, then give yourself time to decide what to do. You are allowed to feel deeply and still choose carefully.",
avoid:"Sometimes distraction is exactly what helps you get through a hard hour. The goal is not to force yourself to face everything all at once, but to make sure avoidance does not become the only place you can live. When you have enough space, gently return to what needs care. You can take it in pieces and ask someone trustworthy to sit with you while you do.",
write:"Writing can help you hear what you actually feel beneath the noise of what you think you should feel. You do not have to make it beautiful or fair. Write what you miss, what hurt, what you wish had happened, and what you need now. The page can hold contradictions without forcing you to settle them immediately. You can keep it private; the point is clarity, not a perfect message.",
self:"It is easy to measure your worth by whether someone chooses you, stays, replies, or understands you. But your life is larger than another person's response. Your interests, friendships, values, and future still belong to you. Reconnecting with them does not mean the person or situation mattered less. It means you matter outside of it, too.",
answers:"Unanswered questions can keep your mind circling because certainty feels like it would finally let you rest. Sometimes you can get clarity by asking directly. Sometimes the other person cannot or will not provide it. Their silence may remain painful, but you can still decide what you know from their actions and what you need to move forward. You do not have to solve every mystery to make a healthy choice.",
boundary:"A boundary is not a punishment or a trick to make someone change. It is a clear decision about what you can participate in and what you will do if something keeps hurting you. Boundaries can protect closeness by making it honest, and they can also show you when a connection is not healthy for you. Caring about someone and protecting yourself are allowed to happen at the same time.",
time:"You are not required to decide what the rest of your life will look like while you are in the middle of a hard chapter. Strong feelings can make a temporary moment sound permanent. Let yourself make the next kind, practical decision without forcing a verdict on your whole future. You can return to the bigger question when you have more information and more room to breathe.",
ground:"Hope can be meaningful, but it becomes exhausting when you have to turn every small detail into evidence. Let people and situations show you what they are through consistent actions over time. You do not need to shut down your imagination; just do not ask it to do the work of facts. You can enjoy a possibility while continuing to live in the present.",
signs:"When you care, small gestures can feel enormous. They may mean something, but they are not always enough to tell you what another person wants or can offer. Look for patterns: consistency, respect, honesty, and whether actions match words. You deserve a connection where you can ask a reasonable question instead of constantly decoding hints.",
honest:"Honesty gives another person a real chance to understand you, but it does not guarantee the answer you hope for. You can speak plainly, respect their freedom to answer honestly, and still take care of yourself afterward. Their response gives you information about compatibility and timing; it does not determine your worth.",
accept:"Accepting reality is not the same as liking it. You can wish things were different while recognising what is actually available right now. That recognition can help you stop spending all your energy trying to persuade a situation to become something it is not. You deserve to make choices based on what is present, not only on what could someday happen.",
prove:"You do not need to become flawless, more useful, or endlessly patient to deserve care. A relationship is not an exam where you earn a passing grade by trying harder than everyone else. Growth is valuable when it helps you become more yourself, not when it turns your life into a campaign to be selected by one particular person. You are allowed to be loved without performing for it.",
respect:"Respect includes the other person's freedom, but it includes yours too. You can honour a no, a boundary, or a lack of readiness without pretending your own feelings do not exist. If the connection leaves you waiting indefinitely, you can decide what distance or limits you need. You do not have to pressure someone to choose you, and you do not have to abandon yourself while they decide.",
possibility:"Possibility is not a promise, but it does not need to be erased just because it is uncertain. Let it remain one part of your life rather than the centre of it. Make plans, keep friendships, and pursue what matters without waiting for a particular outcome. If the possibility grows into something real, you can meet it then. If it does not, you will still have been living.",
miss:"Missing someone is not a verdict. It can mean the connection mattered, the routine became familiar, or the future you imagined still has emotional weight. It does not automatically mean you should return or that leaving was a mistake. Let yourself remember honestly: the good parts were real, and so were the parts that hurt or could not continue. Both truths can belong in the same story.",
blame:"Looking back can help you understand your choices, but hindsight can make you believe you should have known everything from the beginning. You made decisions with the information, feelings, and circumstances you had at that time. Take responsibility for what was yours to change, but do not claim responsibility for another person's choices or for things nobody could predict. Growth should give you more wisdom, not endless reasons to attack yourself.",
relief:"Relief after a loss can feel disloyal, especially when there were good memories too. But relief may be telling you that part of the situation was heavy, uncertain, or asking too much of you. You do not need to turn the other person into a villain to acknowledge that. Grief can honour what mattered; relief can acknowledge what you no longer have to carry.",
confused:"Sometimes what you want back is not the full reality, but a specific moment, a familiar routine, or the future you once pictured. That distinction takes time to understand. Instead of forcing yourself to answer “Do I want it back?”, ask what exactly you are longing for and whether that need can be cared for another way. You do not need a final answer today.",
meaning:"You can make meaning from what happened without deciding that it had to happen. Some losses teach us something; some are simply unfair and painful. You do not owe the world a lesson that makes your suffering sound worthwhile. If a lesson eventually becomes clear, keep it. If not, you can still heal, grow, and build a life that matters beyond the event.",
truth:"The truth can be incomplete, and that can be one of the hardest parts of an ending. You may never know every reason, every feeling, or every alternative outcome. Separate what you know from what you suspect, and do not let guesses become facts just because they explain the pain. You can make a thoughtful decision with imperfect information, and change course when you learn more.",
right:"A choice can be understandable even when the outcome hurts. To look back fairly, consider what you knew, what you needed, what options were realistically available, and whether you acted according to your values. You cannot compare your real past to an imaginary version where everything went perfectly. You can learn from the result without assuming another choice would certainly have saved it.",
release:"Your mind may keep revisiting the past because it hopes one more replay will finally produce certainty. If the answer has not appeared, another hour of replaying may only leave you more tired. You do not have to force the question away; notice it, name what remains unknown, and gently return to something present. Peace can begin before every question is answered.",
move:"Moving forward is not betrayal. You can carry a memory, keep what it taught you, and still let new experiences become meaningful. There is no need to rush into happiness or pretend the ending did not matter. Start with ordinary life: a meal, a conversation, a task, a small plan. A future often returns in modest pieces before it feels like a future.",
unknown:"Not knowing is a real place to be, even if it is uncomfortable. You can leave a question open without giving it every hour of your day. Maybe your understanding will change; maybe the situation will remain unresolved. Either way, you can choose how you treat yourself, who you ask for support, and what you want your next step to look like. Uncertainty does not make you powerless.",
fear:"Fear often tries to keep you safe by turning yesterday's hurt into tomorrow's prediction. It is understandable to be cautious after disappointment, but “this happened before” is not the same as “this must happen every time.” You can learn to notice red flags, move at your own pace, and leave situations that are not good for you. Protecting yourself does not require believing you are destined to be hurt.",
trust:"After being hurt, you may question not only other people but your own ability to choose well. Trusting yourself does not mean believing you will never make a mistake. It means believing you can notice how you are treated, ask for clarity, seek advice, keep boundaries, and respond when something feels wrong. You do not need perfect judgment to build healthier connections; you need permission to listen to what you learn.",
rest:"You can be tired of love without needing to make a permanent decision about it. A break from romance can be a healthy way to recover your energy and reconnect with yourself. You do not need to date, confess feelings, or be optimistic on anyone else's schedule. Let your life be full in ways that do not depend on romance, and allow the future to remain undecided until you genuinely want to revisit it.",
slow:"You do not have to choose between giving someone your whole heart immediately and shutting everyone out. Trust can be built in small steps as you see whether someone is consistent, honest, and respectful. Keep your friendships, interests, boundaries, and voice while a connection grows. A safe pace gives you time to notice the reality of the person, not just the hope of who they might be."
};
