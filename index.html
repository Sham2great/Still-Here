margin:42px 0 17px}.section-head h2{font-size:clamp(22px,4vw,30px);font-weight:500;letter-spacing:-.04em;margin:0}.section-head p{font-size:10px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.story{position:relative;text-align:left;min-height:155px;padding:22px;border:1px solid var(--line);border-radius:12px;background:#ffffff05;color:var(--ink);transition:.2s}.story:hover{transform:translateY(-3px);border-color:#c4a5ff88;background:#c4a5ff0b}.story h3{font-size:18px;font-weight:550;letter-spacing:-.03em;margin:20px 0 8px}.story p{font-size:12px;line-height:1.7;color:var(--muted);margin:0}.arrow{position:absolute;right:19px;top:17px;color:#ffffff55}.foot{margin-top:24px;color:#777681;font-size:10px;letter-spacing:.08em}.scene{max-width:740px;margin:auto}.progress{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:10px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:14px}.track{height:2px;background:#ffffff16;margin-bottom:40px}.track span{display:block;height:100%;background:var(--accent);transition:width .4s}.scene h2,.ending h2{font-size:clamp(38px,7vw,67px);line-height:1;letter-spacing:-.065em;font-weight:500;margin:18px 0 25px}.narrative{font-family:Georgia,serif;font-size:clamp(18px,2.6vw,22px);line-height:1.9;color:#d2ced8;white-space:pre-line;max-width:660px}.question{font-size:13px;color:var(--muted);margin:34px 0 13px}.choices{display:grid;gap:9px}.choice{width:100%;display:flex;align-items:center;gap:15px;text-align:left;border:1px solid var(--line);border-radius:9px;background:#ffffff04;color:var(--ink);padding:16px}.choice:hover{background:#c4a5ff0d;border-color:#c4a5ff88}.choice b{color:var(--accent);font-size:11px;font-weight:500}.choice span{font-size:14px;line-height:1.5}.controls{display:flex;justify-content:space-between;align-items:center;margin-top:25px;gap:12px}.text-btn{border:0;background:transparent;color:var(--muted);padding:10px 0;font-size:11px}.text-btn:hover{color:var(--ink)}.primary{border:1px solid #d4c0ff55;background:var(--accent);color:#15111d;border-radius:30px;padding:13px 20px;font-size:11px;font-weight:750;letter-spacing:.04em}.ending{border:1px solid var(--line);background:linear-gradient(145deg,#c4a5ff0b,#ffffff02);border-radius:15px;padding:clamp(22px,5vw,48px)}.ending h2{max-width:620px}.ending-copy{font-family:Georgia,serif;font-size:18px;line-height:1.95;color:#d6d1dc;white-space:pre-line;max-width:650px}.next{margin-top:25px;padding:17px;border-left:2px solid var(--accent);background:#c4a5ff09;color:#d9d2e7;font-size:13px;line-height:1.8}.closing{text-align:center;padding-top:25px}.closing p{color:var(--muted);font-family:Georgia,serif;font-style:italic;line-height:1.7}.saved{color:var(--muted);font-size:11px;margin-left:8px}@media(max-width:600px){.shell{width:calc(100% - 28px)}.grid{grid-template-columns:1fr}.story{min-height:130px;padding:18px}.story h3{margin-top:16px}.section-head{margin-top:34px}.scene h2,.ending h2{font-size:42px}.track{margin-bottom:28px}.hero h1{font-size:clamp(60px,18vw,92px)}main{padding-top:8px;padding-bottom:28px}.ending-copy{font-size:17px}.cinema{padding:6px 0 12px}.cinema-title{font-size:clamp(50px,16vw,72px);margin:14px 0}.cinema-copy{font-size:16px;line-height:1.55}.cinema-note{margin-top:12px}.cinema-actions{margin-top:16px;gap:14px;flex-wrap:wrap}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

<script>
const stories=[
{title:"WHEN EVERYTHING FALLS APART",desc:"When every part of life feels heavier than you can carry.",intro:"Nothing happened all at once. It was one thing, then another, then another. Messages you haven't answered. Things you promised you'd do. People asking if you're okay when you don't know how to explain that you're not.\n\nTonight, even choosing where to begin feels impossible.",scenes:[
["The pile keeps growing.","You look at everything waiting for you. Some of it matters, but your mind has turned it all into one enormous, impossible thing.","What do you do first?",["Pick the smallest thing and do only that.","Tell someone honestly that I'm struggling.","Force myself through everything.","Step away because I'm at capacity."],["small","reach","pressure","rest"]],
["Someone asks if you're okay.","They seem to mean it. But the truth is messy, and you don't want to become another problem someone has to deal with.","What feels possible?",["Give them the honest, unfinished version.","Say “I'm fine” because explaining feels exhausting.","Ask them to sit with me, even if we don't talk.","I need quiet before I can find the words."],["reach","hide","reach","rest"]],
["The night gets quiet.","The problems haven't vanished. But for a moment, you can see them as separate things instead of one verdict on your entire life.","What do you need to remember?",["I can take this one piece at a time.","Needing help doesn't make me a burden.","Rest is not giving up.","I don't need to punish myself into progress."],["small","reach","rest","kind"]]],
end:{small:["You found a beginning, not a magic fix.","When everything becomes one giant problem, it can feel as if you're failing at life itself. But a pile of problems is still made of separate pieces. You don't have to solve your whole future tonight.","Choose one task that takes ten minutes or less. Do only that, then decide what comes next."],reach:["You are allowed to be a person, not a machine.","You've been trying to carry everything without letting anyone see how heavy it is. You deserve support before you reach a breaking point, not only after. Asking for help is not the same as being a burden.","Message someone you trust: “I'm overwhelmed. Could you stay with me or help me figure out the first step?”"],rest:["Rest is not something you have to earn.","You don't have to earn the right to pause by exhausting yourself first. Rest won't untangle everything, but you may see the knots more clearly when you're not running on empty.","Take a real pause, then write down only the next necessary step, not the next ten."],pressure:["Pressure is not the only way to keep moving.","Pressure can get you through a moment, but it can also make every unfinished thing feel like proof that you're not enough. You are a person dealing with a lot, not a machine falling behind its schedule.","Sort your list into “today,” “later,” and “ask for help.” Let it be a plan, not a judgment."],hide:["You don't have to explain everything perfectly to be honest.","It makes sense to protect the little energy you have left. But you deserve to be seen in the hard parts too. You can start with one sentence; you don't owe anybody a polished explanation.","Write the sentence you wish someone understood, even if you're not ready to send it."]}},
{title:"THE PERSON YOU LOST",desc:"Missing a relationship that mattered more than you can explain.",intro:"There are little things you still want to tell them. A song comes on, something funny happens, or you remember a version of yourself that seemed to exist around them.\n\nYou don't only miss a person. You miss the ordinary future you thought was waiting for you.",scenes:[
["Something reminds you of them.","For a second, you forget. Then the memory returns, and you have to meet the loss all over again.","What do you do with the feeling?",["Let the memory exist without acting on it.","Reach out because I miss them.","Distract myself before it gets heavier.","Write what I wish I could tell them."],["feel","reach","avoid","write"]],
["You wonder if it meant as much to them.","You replay moments, searching for proof that it was real. Part of you wants answers; another part fears what you might find.","Which thought do you sit with?",["It mattered to me, and that part was real.","I need to know if they miss me too.","I can miss them without reopening everything.","I don't have to decide tonight."],["self","answers","boundary","time"]],
["You imagine the next chapter.","It looks different from the one you planned. You aren't excited about every part of it, but it is still unwritten.","What would caring for yourself look like?",["Let myself grieve without a deadline.","Set a boundary around checking on them.","Reconnect with a part of my own life.","Stop demanding that I feel okay already."],["feel","boundary","self","time"]]],
end:{feel:["You let the feeling exist without letting it drive.","Missing someone doesn't automatically mean you should return, and moving forward doesn't require pretending they meant nothing. Grief can arrive in ordinary moments. You can let it visit without handing it every decision.","When a memory hits, name it, breathe, and choose one gentle thing to do in the present."],reach:["You can miss them and still protect yourself.","Wanting contact is understandable, especially when someone used to be part of your every day. Before reaching out, ask what you're hoping the message will change, and whether you can care for yourself if the answer isn't what you want.","Write the message in your notes first. Revisit it later, when the feeling isn't the loudest voice in the room."],avoid:["You don't have to outrun every memory.","Distraction can help you get through a hard hour. You also deserve space to feel what happened when you're ready, without turning every wave of sadness into a problem to solve.","Talk to someone you trust or write for ten minutes about what you miss and what you need now."],write:["Some things need somewhere to go, even if they never get sent.","You may never get to say everything you wanted to say. Writing can give those words a place to land without making your healing depend on their response.","Write two lists: what you miss, and what you need from a relationship going forward."],self:["The relationship mattered, and so do you outside it.","You can honour what was good without deciding it was the only good thing life could ever hold. The future feels unfamiliar because you haven't lived it yet, not because it has nothing for you.","Bring back one small thing that belonged to you before the relationship: a hobby, a friend, a routine, or a goal."],answers:["Your worth cannot wait for their confirmation.","It hurts not to know whether the other person carries the same memories. But their ability to express what they feel is not the final measure of what you gave or who you are.","When you catch yourself searching for proof, ask what you already know about how you were treated and what you need."],boundary:["A boundary can be an act of care, not cruelty.","You can honour what a chapter meant and still stop rereading it every day. Distance isn't proof that the relationship was fake. Sometimes it's what gives you room to hear your own needs again.","Pick one boundary that protects your peace for the next week, such as muting updates or asking a friend not to relay news."],time:["You don't have to be okay on anybody else's schedule.","Healing rarely follows a neat timeline. You can have a better day and still miss them tomorrow. That doesn't erase the progress you've made.","Choose one ordinary thing today that reconnects you with your life outside the loss."]}},
{title:"ALMOST, BUT NEVER YOURS",desc:"Genuinely liking someone who feels out of reach.",intro:"You catch yourself saving little details about them. Their favourite things. The way they talk when they're comfortable. The version of the day you imagine if timing, distance, or feelings were different.\n\nYou genuinely like them. That's exactly why uncertainty has so much room to grow.",scenes:[
["You imagine what could happen.","Nothing has been promised. Still, your mind builds little futures from small moments, and you find yourself hoping.","How do you handle that hope?",["Enjoy the feeling without treating it as a promise.","Look for signs they might feel the same.","Be honest when it feels appropriate.","Keep my life moving instead of waiting."],["ground","signs","honest","self"]],
["Their reality is different from yours.","They might not be ready, might not feel the same, or might simply be in a different place. It isn't a puzzle you can solve by caring harder.","What is hardest to accept?",["I can't make the timing right by myself.","I keep hoping I'll become the exception.","I want to respect their space and still feel what I feel.","I don't want to lose the possibility."],["accept","prove","respect","possibility"]],
["You choose how to carry it.","You can care about them without making them responsible for your happiness. You can also admit that a feeling is taking more from you than you expected.","What do you want your next step to protect?",["My peace and their freedom to choose.","My honesty, without demanding an answer.","My life beyond this person.","The possibility, while staying grounded."],["respect","honest","self","ground"]]],
end:{ground:["Let hope be a feeling, not a forecast.","You don't have to kill the hope to stay grounded. You only have to stop treating every small moment as evidence of a future that hasn't been agreed to. Let what is real be enough information for today.","Make one plan this week that has nothing to do with this person, and let yourself enjoy it fully."],signs:["You deserve clarity more than endless decoding.","When someone matters to you, every little detail can feel like a clue. But you cannot build certainty from hints alone, and you shouldn't have to live inside a detective story to feel okay.","Separate what they have actually communicated from what you hope it means. Let the first guide your next step."],honest:["Honesty is brave when it leaves room for their answer.","You can express what you feel without turning it into a debt they must repay. Their answer may hurt or surprise you, but a clear reality gives both of you more freedom than endless guessing.","If you tell them, keep it kind, simple, and free of pressure. Make room for any answer."],self:["Your life cannot be put on hold for a maybe.","The possibility of someone can become so vivid that your own life starts to feel like a waiting room. You can care about them and still build days that feel worthwhile whether or not they choose you.","Choose one goal, friendship, or activity to invest in this week because it matters to you."],accept:["You can care deeply without controlling the outcome.","Timing and feelings are not tests you pass by being patient enough or good enough. Another person's readiness is theirs to decide. That truth can hurt without becoming a verdict on your worth.","Ask what is actually available to you in this connection right now, not only what you wish might become available."],prove:["You don't have to become more worthy to earn someone's feelings.","It can be tempting to turn uncertainty into a challenge to improve yourself until they choose you. But affection is not a prize awarded for enough effort, and you shouldn't have to disappear into proving yourself.","Write down three things you value about yourself that have nothing to do with whether this person likes you."],respect:["Care should leave room for both people to be free.","You can respect their boundaries and take your feelings seriously at the same time. You don't have to chase, pressure, or pretend not to care. You can decide what closeness is healthy for you, too.","Choose a boundary that honours both sides: no repeated asking, no waiting by your phone, and no abandoning your own plans."],possibility:["A possibility can matter without becoming your whole future.","You don't have to force yourself to stop hoping today. Just remember that possibility is not a promise, and your life deserves attention while the answer is unknown.","Give yourself a boundary for revisiting the situation, then return your attention to something you can shape."]}},
{title:"THE QUESTIONS THEY LEFT BEHIND",desc:"Someone disappeared, leaving you to make sense of silence.",intro:"One day, there was a conversation. Then less of one. Then nothing that made sense. You replay the last messages and wonder which moment changed everything.\n\nThe silence left a space, and your mind keeps trying to fill it with an answer.",scenes:[
["You reread the last conversation.","You search for the sentence that explains it all. Maybe if you find it, the confusion will finally stop.","What are you hoping to find?",["A clear reason so I can understand.","Proof I didn't imagine what we had.","Something I could have done differently.","A way to stop checking for a new message."],["answers","worth","blame","release"]],
["You fill in the blanks.","Some explanations blame you. Others blame them. All of them feel convincing for a moment, because not knowing is exhausting.","Which truth do you need?",["I can admit I don't know their reasons.","I want to ask one clear question.","Their silence doesn't define my value.","I need to stop reopening the same wound."],["accept","ask","worth","release"]],
["There may never be a final explanation.","You can want an answer and still begin living without one. Those two truths can sit beside each other, even if it takes time to believe them.","What would closure mean?",["Choosing not to keep waiting.","Accepting uncertainty without blaming myself.","Asking once, then respecting whatever comes.","Remembering I deserved communication."],["release","accept","ask","worth"]]],
end:{answers:["Your need for an explanation makes sense.","Unanswered questions can keep a connection alive in your mind long after the conversation has ended. You may never know the whole story, and that uncertainty is real. But you don't need a complete account of their choices to decide what you need from relationships.","Write down your questions, then mark which only they could answer and which decisions you can make without them."],worth:["Their silence is not a measurement of your worth.","Being left without an explanation can make you inspect yourself for flaws. But someone else's choice not to communicate clearly is not a reliable measure of your lovability, value, or whether the connection mattered.","Write down what you know you brought to the connection, without using their response as the grading system."],blame:["You can learn from a connection without taking responsibility for all of it.","Your mind may search for a mistake because a painful answer can feel easier to control than uncertainty. If there is something to learn, you can learn it with compassion. You don't have to invent guilt just to make the story feel complete.","Ask what you would tell a friend who was blaming themselves with the same evidence."],release:["You are allowed to stop waiting for a notification to give you permission to live.","Checking can feel like the one thing that might finally end the uncertainty. Often it just makes your day orbit a person who isn't showing up. You can care about what happened and still take your attention back.","Try a short, realistic break from checking their profile or chat, and fill that time with something that brings you back to your own life."],accept:["Not knowing is painful, but it isn't proof you did something wrong.","You may never get an ending that makes every detail click into place. Accepting that doesn't mean approving of how you were treated. It means refusing to let the missing explanation write the rest of your story.","When you start guessing at their reasons, remind yourself: “I don't know, and I don't have to turn that into my fault.”"],ask:["You can ask for clarity without making your peace depend on the reply.","If it feels safe and appropriate, one direct message can communicate what you need to say. After that, their response or lack of response is information about what they can offer, even if it isn't the explanation you wanted.","Decide in advance what boundary will help you care for yourself after asking, whatever the response."]}},
{title:"TIME IS RUNNING OUT",desc:"School, deadlines, and the fear of falling behind.",intro:"The deadlines are getting closer. Everyone seems to know what they're doing. You keep calculating how much time is left and how much you should already have finished.\n\nEven when you rest, part of your mind is counting everything you haven't done.",scenes:[
["You look at everything due.","The list feels longer than the time you have. You start thinking about grades, the future, and every possible way things could go wrong.","Where do you begin?",["Choose the most urgent task and work for 15 minutes.","Ask a teacher or classmate what to prioritize.","Make a realistic plan with breaks included.","Panic and try to do everything at once."],["start","ask","plan","panic"]],
["You compare your progress.","Someone mentions how much they finished. You feel behind before you even know their circumstances or what their work looks like.","What do you remind yourself?",["Their timeline isn't a measurement of mine.","Check actual deadlines, not my fears.","I can ask for help before I'm completely stuck.","I should sacrifice rest and push harder."],["compare","facts","ask","panic"]],
["You have one evening left today.","You cannot complete every future task tonight. You can make one decision that helps tomorrow-you arrive with a little more clarity.","What will you choose?",["Finish one concrete piece of work.","Plan tomorrow and get enough rest.","Contact someone about what I can't manage alone.","Stop treating one difficult term as my whole future."],["start","plan","ask","compare"]]],
end:{start:["Momentum can begin with something small.","When everything feels urgent, starting can feel impossible because you're trying to solve the whole future in one sitting. A small completed task won't fix every deadline, but it can give you evidence that you can move.","Set a 15-minute timer, pick one specific task, and make the goal “begin,” not “finish everything.”"],ask:["Getting support early is a skill, not a failure.","You are not supposed to know how to solve every academic problem alone. Teachers, classmates, tutors, and family may help you sort priorities or understand a topic before the pressure grows.","Send one clear message asking what to prioritize or which part you should tackle first."],plan:["A plan should help you breathe, not become another threat.","A schedule that assumes you never get tired isn't realistic. You need time to work, eat, rest, and recover your focus. Planning helps when it reflects the person who has to follow it.","List your next three tasks, estimate how long each may take, and schedule a real break."],panic:["Fear is loud, but it is not a reliable timetable.","Sacrificing every break may feel like taking control, but exhaustion can make work harder. You can take your responsibilities seriously without treating yourself harshly.","Pause long enough to identify the nearest real deadline and one action you can take toward it."],compare:["You are not seeing the whole picture of anyone else's progress.","Comparison turns other people's visible milestones into a deadline for your own life. You don't know all their support, struggles, or starting points. Your next step should come from your actual situation.","Check the real dates and requirements for your work. Let those facts guide your next step."],facts:["Facts can give your fear something solid to stand on.","Anxiety turns possibilities into certainties: “I'll fail,” “I'm too late,” “I've ruined everything.” You deserve to respond to the situation you actually have, not every frightening outcome your mind imagines.","Write down the next deadline, what is required, and who can help. Start with what you can verify."]}},
{title:"EVERY TIME I START TO BELIEVE",desc:"Getting hopeful, then disappointed when it matters.",intro:"You told yourself not to get your hopes up this time. Then something started going right. You let yourself picture it working out, just a little. You began to believe.\n\nAnd now you're back trying to figure out why you ever let yourself hope in the first place.",scenes:[
["The familiar feeling returns.","A new opportunity, person, or plan begins to matter. Part of you is excited. Another part is already preparing for the letdown.","How do you respond to hope?",["Let myself be excited while staying realistic.","Expect the worst so it can't surprise me.","Look for proof this time is different.","Keep it at a distance so it can't hurt much."],["hope","guard","proof","distance"]],
["It doesn't work out as you wanted.","You're disappointed, and the feeling starts trying to become a bigger story: maybe nothing ever works out for you.","What do you tell yourself?",["This hurt, but it doesn't predict everything.","I should have known better than to hope.","I need time to feel this before deciding what it means.","Understand what was in and out of my control."],["reframe","blame","feel","learn"]],
["Something new eventually appears.","You don't have to be ready to trust it immediately. You also don't have to let every past disappointment make every future decision for you.","What would moving forward look like?",["Try again slowly, with my eyes open.","Learn the lesson without insulting myself.","Take a break before I choose again.","Let actions, not promises, build my confidence."],["hope","learn","feel","proof"]]],
end:{hope:["You don't have to stop hoping. You can learn how to hold it.","Hope makes you vulnerable to disappointment because it lets something matter. That doesn't make hope foolish. You can be excited without deciding the outcome is guaranteed, and be disappointed without deciding the future has already repeated itself.","Let yourself look forward to one thing while staying grounded in what you know and what remains uncertain."],guard:["Protecting yourself from every letdown can also keep good things at a distance.","It makes sense to want to avoid the familiar crash. But expecting pain in advance doesn't always make it hurt less; sometimes it makes you live through the disappointment before anything has happened.","Try replacing “this will fail” with “I don't know yet, and I'll respond to what actually happens.”"],proof:["Trust can grow from evidence without becoming a search for guarantees.","You want a reason to believe this time might be different. That's reasonable. Look for consistency and honest communication, not a promise that nothing will ever go wrong.","Name two real signs of progress and one boundary that would help you respond if things change."],distance:["Distance can protect you, but it can also leave you lonely inside your own life.","You don't have to give every new thing your whole heart immediately. A measured pace is different from refusing to care at all. You can let something matter gradually and keep your own footing.","Choose one small, low-risk way to participate instead of deciding the whole outcome in advance."],reframe:["A painful outcome is an event, not a prophecy.","When disappointments repeat, the mind starts looking for a rule that explains them. But “this didn't work out” and “nothing will work out for me” are different statements. One describes what happened. The other tries to decide every chapter that hasn't happened yet.","Write down what specifically went wrong, without using words like “always” or “never.” See what the facts actually say."],blame:["You can regret getting your hopes up without punishing yourself for having them.","You were responding to something that mattered to you. The outcome may show you something about timing or expectations, but it doesn't prove you were foolish to feel excited.","Speak to yourself the way you'd speak to someone you care about who took a chance and got hurt."],feel:["You don't have to turn disappointment into a lesson before you're ready.","Sometimes the first thing you need is to admit that it hurts. You can analyse what happened later. Giving yourself time to feel isn't the same as staying stuck there.","Give yourself a little space today, then choose when you'll revisit the practical parts of what happened."],learn:["You can learn from what happened without making yourself responsible for everything.","Some things were within your control; some were not. Finding that difference can help you grow without turning every setback into evidence that you should have known better.","Write two columns: “what I could influence” and “what I couldn't control.” Let your next step come from the first column."]}},
{title:"WHAT IF IT WAS RIGHT THERE?",desc:"Searching so hard you overlook something meaningful.",intro:"You've been looking for something. Maybe the right person, the perfect opportunity, the moment when life finally clicks into place. You keep looking ahead, wondering when it will arrive.\n\nThen a quieter question slips in: what if I've been overlooking something because it didn't look the way I expected?",scenes:[
["You keep looking toward the next thing.","The next milestone. The next person. The next version of life where you'll finally feel settled. The present starts to look like a hallway instead of somewhere you live.","What do you notice?",["I may be postponing happiness until everything is perfect.","I know what I want, and I don't want to settle.","I haven't noticed who has been showing up for me.","I'm afraid if I stop searching, I'll miss my chance."],["present","standards","people","fear"]],
["Something familiar asks for attention.","A friendship, a skill, an opportunity, or a part of yourself has been there quietly. It might matter. It might not be what you need. You owe it curiosity, not automatic acceptance.","How do you decide?",["Pay attention to how it actually makes me feel.","Stop comparing it to an imagined perfect option.","Keep my standards, but question my assumptions.","Ask whether I'm ignoring it out of fear or habit."],["notice","present","standards","fear"]],
["You get a clearer view.","Not everything nearby is right for you. Not everything far away is better. The work is learning to tell the difference between something meaningful and something you've stopped seeing.","What will you take with you?",["Be more present with the life I already have.","Appreciate someone who has been there.","Stay open without lowering my standards.","Notice before I dismiss something as ordinary."],["present","people","standards","notice"]]],
end:{present:["Your life is happening before the big moment arrives.","It's easy to treat the present as a waiting room for the version of life you believe will finally count. But your days are not placeholders. You can pursue what you want while allowing today's people, progress, and small moments to matter.","Name one thing in your current life you want to experience more fully this week, and give it your attention."],standards:["Noticing what's near doesn't mean settling for less.","This isn't a lesson in accepting whatever happens to be available. You can keep your values and still question whether your picture of “right” has become so specific that it blocks you from recognising something real.","Write down the qualities that truly matter to you, then separate them from details that are only part of the picture in your head."],people:["Sometimes care is quiet enough to become part of the background.","Someone showing up consistently can start to feel ordinary because you know they're there. That doesn't mean you owe them closeness or that they're automatically the answer. It does mean their effort may deserve to be seen.","Think of one person whose care you value and tell them one specific thing you appreciate, without expecting anything in return."],fear:["Fear can make the familiar invisible and the unknown feel magical.","Sometimes you keep searching because you're curious; sometimes because choosing something real means risking that it won't be perfect. You don't need to stop exploring. Just notice when the search keeps you from engaging with your actual life.","Ask yourself: if I weren't afraid of choosing wrong, what would I give a fair chance to? You don't have to commit; just investigate."],notice:["You don't have to know what something means before giving it your attention.","A meaningful thing doesn't always arrive with a dramatic soundtrack. Sometimes you discover its value by being present long enough to notice what it adds to your life. Sometimes you discover it isn't right. Both are useful information.","Spend ten undistracted minutes with something or someone you usually take for granted, and notice what you learn."]}},
{title:"WAS IT FOR THE BETTER?",desc:"Something you cherished left your life, and you don't know whether to grieve it or be grateful.",intro:"You didn't want to lose it. Maybe it was a person, a friendship, a dream, a place, or a version of life you thought you'd get to keep. Whatever it was, it mattered.\n\nNow it's gone, and everyone seems to expect you to make peace with it. But how do you call something a blessing when all you can feel is the space it left behind?\n\nYou keep asking the same question: was losing it for the better, or am I just trying to make the pain mean something?",scenes:[
["You miss what it used to be.","A memory catches you off guard. For a moment, you want the old version back, before everything changed. You wonder if missing it means you made the wrong choice, or if you simply haven't learned how to live without it yet.","What feels most true right now?",["I miss it, even if I know things couldn't stay the same.","I keep wondering what I could've done to prevent this.","Part of me feels relieved, then guilty for feeling that way.","I can't tell whether I want it back or just want the hurt to stop."],["miss","blame","relief","confused"]],
["You search for a reason.","You try to turn the loss into a lesson. Maybe it happened for a reason. Maybe it was protecting you. Maybe it was just unfair, and there isn't a clean explanation. None of those possibilities can erase what it meant to you.","What answer are you searching for?",["I need to believe something better can come from this.","I want the truth, even if there isn't a neat reason.","I want to know if letting go was the right thing.","I wish I could stop needing the past to make sense."],["meaning","truth","right","release"]],
["You stand between what was and what comes next.","You don't have to rewrite the past as terrible to accept that it's over. You don't have to call the loss good to keep living. Maybe one day you'll understand it differently. Maybe you'll simply understand yourself better.","What are you ready to allow?",["I can miss it and still move forward.","I can admit it hurt without calling my whole story ruined.","I can learn from it without pretending it was meant to happen.","I don't know yet, and I can be honest about that."],["move","truth","meaning","unknown"]]],
end:{
miss:["Missing it doesn't mean you should have kept it.","You can miss something and still know that something had to change. Your heart doesn't instantly catch up to what your mind understands. Grief isn't proof that you made the wrong choice, and love or meaning doesn't disappear just because something ended. You don't have to make the past ugly to give yourself permission to move forward.","Write down two truths: what you genuinely miss, and what was difficult or unsustainable. Let both be true."],
blame:["You can look back without putting yourself on trial.","When something precious ends, your mind may replay every moment looking for the one move that could have saved it. Reflection can teach you something, but hindsight can make you believe you had control you never really had. You were making choices with the understanding and circumstances you had then.","Ask yourself what you actually knew at the time, not what seems obvious now. Learn from the past without punishing the person you were."],
relief:["Relief and grief can exist in the same heart.","Sometimes losing something hurts and brings relief at once. That doesn't make you fake or ungrateful. You can miss the good parts while recognising what was heavy, and you don't owe anyone a simpler version of what you feel.","Give yourself permission to name both sides privately, without forcing either feeling to cancel the other."],
confused:["You don't have to want it back to wish it hadn't hurt.","Sometimes we miss the familiarity, the plans, or who we were before things changed. That isn't always the same as wanting the whole situation back. You don't need to make a final decision about what it all means while you're still hurting.","Ask: “What exactly do I want back: the reality, the good moments, the routine, or the future I imagined?”"],
meaning:["You can build meaning without claiming the loss was destined.","Maybe something good will grow from this. Maybe the lesson will take time to see. You don't have to call every painful thing necessary or pretend the universe arranged it for you. Meaning can be something you create afterward, not a reason you must invent for why it happened.","Choose one thing this experience has taught you about what you need, value, or want to protect next time."],
truth:["An honest ending doesn't need a beautiful explanation.","Sometimes there is no satisfying reason. Sometimes people change, circumstances shift, or something simply cannot continue. That can feel deeply unfair. You are allowed to grieve the lack of an answer without filling the silence with a story that hurts you more.","Write down what you know for certain, what you don't know, and what you can choose regardless."],
right:["You can evaluate a choice without demanding certainty.","You may never get proof that another path would have been better. Try looking at what you knew, what mattered to you, and what the situation was actually asking of you. A difficult outcome doesn't automatically make the choice wrong.","Think about whether your decision respected your needs and values with the information you had at the time."],
release:["You don't need the past to make perfect sense before you can live again.","Your mind keeps returning because it wants a clean ending. But sometimes peace begins when you stop asking the same question to produce an answer it doesn't have. You can carry what mattered without carrying the question every hour.","When the loop starts, gently name it: “I'm looking for certainty again.” Then do one small thing that brings you into the present."],
move:["Moving forward doesn't erase what it meant.","You can keep the memory and still make room for a life that looks different. Healing isn't a vote against the past. It is slowly giving the present a chance to become real again, even while part of you still looks back.","Choose one small thing you can look forward to that belongs to your life now, however ordinary it seems."],
unknown:["You are allowed to leave the question unanswered for now.","Maybe it was for the better. Maybe it was simply something painful that happened, and the better part will be what you choose from here. You do not need to force gratitude out of grief. You can be uncertain and still take your next step.","Replace “Was this for the better?” with “What would help me take care of myself now?” You can return to the bigger question when you have more room to breathe."]
}}

let current=-1,step=0,answers=[],audioCtx=null,oscillators=[];
const app=document.getElementById("app");
function cinematic(){app.innerHTML='<div class="cinema"><div class="cinema-inner"><p class="cinema-kicker">A quiet place for the things you carry</p><h1 class="cinema-title">STILL,<br><span>HERE.</span></h1><p class="cinema-copy">Life doesn’t always give you the words for what you’re going through. Sometimes you lose someone. Sometimes you lose yourself for a while. Sometimes something ends, and you’re left wondering whether it was a mistake or the beginning of something you can’t see yet.\n\nThis is an interactive experience about those moments. You’ll walk through a story, make choices that feel honest to you, and receive a reflection shaped by what you chose. There are no scores and no perfect answers. You don’t have to pretend you’re okay.\n\nTake your time. Choose what feels closest. This isn’t here to tell you what your life means. It’s here to give you a little space to hear yourself.</p><p class="cinema-note">NO RIGHT ANSWERS · NO NEED TO PRETEND</p><div class="cinema-actions"><button class="primary" id="enterSite">ENTER THE EXPERIENCE ↗</button><button class="text-btn" id="skipIntro">SKIP INTRO</button></div></div></div>';document.getElementById("enterSite").onclick=home;document.getElementById("skipIntro").onclick=home;window.scrollTo(0,0)}
function home(){current=-1;step=0;answers=[];let cards=stories.map((s,i)=>'<button class="story" data-story="'+i+'"><span class="num">0'+(i+1)+' / 08</span><span class="arrow">↗</span><h3>'+s.title+'</h3><p>'+s.desc+'</p></button>').join("");app.innerHTML='<div class="hero"><p class="eyebrow">For the things you don’t know how to say</p><h1>STILL,<br><span>HERE.</span></h1><p class="lead">Some things are hard to explain when you’re living through them. Pick the one that feels closest to you. You don’t have to make it sound smaller here.</p><p class="fine">No perfect answers. No score. Just a little space to hear yourself think.</p></div><div class="rule"></div><div class="section-head"><h2>What have you been carrying?</h2><p>CHOOSE ONE TO BEGIN</p></div><div class="grid">'+cards+'</div><div class="foot">TAKE YOUR TIME · YOU CAN START AGAIN WHENEVER YOU NEED</div>';app.querySelectorAll("[data-story]").forEach(b=>b.onclick=()=>intro(Number(b.dataset.story)));window.scrollTo(0,0)}
function intro(i){current=i;step=-1;answers=[];const s=stories[i];app.innerHTML='<div class="scene"><div class="progress"><span>0'+(i+1)+' / 08 · '+s.title+'</span><span>THE BEGINNING</span></div><div class="track"><span style="width:8%"></span></div><p class="eyebrow">Take a breath. There is no rush.</p><h2>'+s.desc+'</h2><p class="narrative">'+s.intro+'</p><div class="controls"><button class="text-btn" id="home">← ALL EXPERIENCES</button><button class="primary" id="begin">ENTER THE SCENARIO ↗</button></div></div>';document.getElementById("home").onclick=home;document.getElementById("begin").onclick=()=>{step=0;scene()};window.scrollTo(0,0)}
function scene(){const s=stories[current];if(step>=s.scenes.length){ending();return}const sc=s.scenes[step],pct=Math.round((step+1)/s.scenes.length*100);let choices=sc[3].map((label,j)=>'<button class="choice" data-choice="'+j+'"><b>0'+(j+1)+'</b><span>'+label+'</span></button>').join("");app.innerHTML='<div class="scene"><div class="progress"><span>0'+(current+1)+' / 08 · '+s.title+'</span><span>MOMENT '+(step+1)+' OF '+s.scenes.length+'</span></div><div class="track"><span style="width:'+pct+'%"></span></div><p class="eyebrow">Stay with the moment</p><h2>'+sc[0]+'</h2><p class="narrative">'+sc[1]+'</p><p class="question">'+sc[2]+'</p><div class="choices">'+choices+'</div><div class="controls"><button class="text-btn" id="leave">← LEAVE SCENARIO</button><span class="fine">Choose what feels most honest.</span></div></div>';app.querySelectorAll("[data-choice]").forEach(b=>b.onclick=()=>{answers.push(sc[4][Number(b.dataset.choice)]);step++;scene()});document.getElementById("leave").onclick=home;window.scrollTo(0,0)}
function ending(){const s=stories[current],counts={};answers.forEach(a=>counts[a]=(counts[a]||0)+1);const key=Object.keys(counts).sort((a,b)=>counts[b]-counts[a])[0],e=s.end[key]||s.end[answers[answers.length-1]]||Object.values(s.end)[0];app.innerHTML='<div class="scene"><div class="progress"><span>0'+(current+1)+' / 08 · YOUR REFLECTION</span><span>THE ENDING</span></div><div class="track"><span style="width:100%"></span></div><div class="ending"><p class="small">A NOTE FOR YOU</p><h2>'+e[0]+'</h2><p class="ending-copy">'+e[1]+'</p><div class="next"><span class="small">ONE SMALL NEXT STEP</span><br>'+e[2]+'</div></div><div class="closing"><p>You don’t have to leave here completely okay.<br>Just a little more understood, perhaps.</p><p class="fine">This experience is a pause, not a replacement for support from people you trust.</p><button class="primary" id="save">SAVE THIS NOTE ↗</button><span class="saved" id="saved"></span><div class="controls"><button class="text-btn" id="again">↻ EXPERIENCE THIS AGAIN</button><button class="text-btn" id="home">← CHOOSE ANOTHER</button></div></div></div>';document.getElementById("save").onclick=()=>{const blob=new Blob(["STILL, HERE.\n"+e[0]+"\n\n"+e[1]+"\n\nONE SMALL NEXT STEP\n"+e[2]],{type:"text/plain;charset=utf-8"});const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="still-here-note.txt";a.click();URL.revokeObjectURL(url);document.getElementById("saved").textContent="Your note is ready."};document.getElementById("again").onclick=()=>intro(current);document.getElementById("home").onclick=home;window.scrollTo(0,0)}
document.getElementById("soundBtn").onclick=async function(){const btn=this;if(audioCtx){oscillators.forEach(o=>{try{o.stop()}catch(e){}});oscillators=[];await audioCtx.close();audioCtx=null;btn.textContent="SOUND: OFF";return}try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();const master=audioCtx.createGain();master.gain.value=.018;master.connect(audioCtx.destination);[110,164.81,220].forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type="sine";o.frequency.value=f;g.gain.value=[.3,.18,.12][i];o.connect(g);g.connect(master);o.start();oscillators.push(o)});btn.textContent="SOUND: ON"}catch(e){btn.textContent="SOUND UNAVAILABLE"}};
cinematic();
</script></body></html>
